name: Security Signals submissions

on:
  pull_request:
    paths:
      - '.github/workflows/security-signals-submissions.yml'
      - 'cmd/clawscan/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'leaderboard/submissions/**'
      - 'scripts/validate-security-signals-submissions.sh'

permissions:
  contents: read

jobs:
  validate:
    name: Validate submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate changed submissions
        run: scripts/validate-security-signals-submissions.sh

      - name: Upload score previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-signals-submission-scores
          path: dist/security-signals-submission-scores
          if-no-files-found: ignore
