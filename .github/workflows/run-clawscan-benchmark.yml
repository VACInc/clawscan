name: Run ClawScan Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Benchmark ID or alias, for example clawhub-security-signals or SkillTrustBench.
        required: true
        default: clawhub-security-signals
      profile:
        description: Profile to run. Leave empty to use --scanner values instead.
        required: false
        default: clawhub
      config_path:
        description: Optional .clawscan.yml path. Requires profile.
        required: false
        default: ""
      scanners:
        description: Optional comma/space-separated scanners when profile is empty.
        required: false
        default: ""
      ids:
        description: Optional benchmark ID source. Accepts a local text/JSONL path or HTTPS JSONL URL.
        required: false
        default: ""
      ids_sha256:
        description: Required SHA-256 when ids is an HTTP(S) URL.
        required: false
        default: ""
      limit:
        description: Row limit. Use 0 for the full split.
        required: false
        default: "10"
      offset:
        description: Row offset for reproducible chunks.
        required: false
        default: "0"
      sandbox:
        description: ClawScan command sandbox mode.
        required: false
        default: docker
        type: choice
        options:
          - docker
          - off
      commit_sha:
        description: Exact 40-character commit SHA to benchmark. Must be an ancestor of trusted_ref.
        required: true
      trusted_ref:
        description: Trusted branch that commit_sha must descend from.
        required: false
        default: main
  workflow_call:
    inputs:
      benchmark_id:
        type: string
        required: true
      profile:
        type: string
        required: false
        default: clawhub
      config_path:
        type: string
        required: false
        default: ""
      scanners:
        type: string
        required: false
        default: ""
      split:
        type: string
        required: false
        default: ""
      ids:
        type: string
        required: false
        default: ""
      ids_sha256:
        type: string
        required: false
        default: ""
      limit:
        type: string
        required: false
        default: "10"
      offset:
        type: string
        required: false
        default: "0"
      predictions_output:
        type: string
        required: false
        default: ""
      output_path:
        type: string
        required: false
        default: ./artifacts/clawscan-benchmark.json
      artifact_name:
        type: string
        required: false
        default: clawscan-benchmark
      sandbox:
        type: string
        required: false
        default: docker
      sandbox_image:
        type: string
        required: false
        default: ghcr.io/openclaw/clawscan-runtime@sha256:8795ee4802f8d3cb58bd724594e3794d2950b6a684df516064cf2761d9e63b09
      commit_sha:
        type: string
        required: true
      trusted_ref:
        type: string
        required: false
        default: main
    secrets:
      LLM_API_KEY:
        required: false
      DEFAULT_MODEL:
        required: false
      DEFAULT_BASE_URL:
        required: false
      DEFAULT_MODEL_CONTEXT_WINDOW:
        required: false
      LOG_LEVEL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      CODEX_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      SNYK_TOKEN:
        required: false
      SOCKET_CLI_API_TOKEN:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Run ${{ inputs.benchmark_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trust root, verify ancestry, and check out detached commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TRUSTED_REF: ${{ inputs.trusted_ref }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # This job holds credentials, so it only ever executes code that is
          # already part of the trusted branch history.
          case "$TRUSTED_REF" in
            main | refs/heads/main)
              TRUSTED_BRANCH=main
              ;;
            trusted/*)
              TRUSTED_BRANCH="$TRUSTED_REF"
              ;;
            refs/heads/trusted/*)
              TRUSTED_BRANCH="${TRUSTED_REF#refs/heads/}"
              ;;
            *)
              echo "trusted_ref must be main or trusted/*, got $TRUSTED_REF" >&2
              exit 1
              ;;
          esac
          git check-ref-format --branch "$TRUSTED_BRANCH" >/dev/null
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-character lowercase hex SHA" >&2
            exit 1
          fi
          TRUSTED_SHA="$(
            git ls-remote --exit-code --refs "$REMOTE_URL" "refs/heads/$TRUSTED_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          if ! printf '%s' "$TRUSTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "trusted_ref did not resolve to exactly one commit SHA: $TRUSTED_REF" >&2
            exit 1
          fi

          git init .
          git remote add origin "$REMOTE_URL"
          git fetch --no-tags origin "refs/heads/$TRUSTED_BRANCH"
          FETCHED_TRUSTED_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$FETCHED_TRUSTED_SHA" != "$TRUSTED_SHA" ]; then
            echo "trusted_ref changed while it was being validated; retry the workflow" >&2
            exit 1
          fi
          if ! git cat-file -e "${COMMIT_SHA}^{commit}" 2>/dev/null; then
            echo "commit_sha is not present in the trusted branch history" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "$TRUSTED_SHA"; then
            echo "commit_sha is not an ancestor of $TRUSTED_REF; refusing to run untrusted code with secrets" >&2
            exit 1
          fi
          git checkout --detach "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: Verify benchmark ID source
        env:
          IDS_SOURCE: ${{ inputs.ids }}
          IDS_SHA256: ${{ inputs.ids_sha256 }}
        run: bash scripts/verify-benchmark-id-source.sh

      - name: Classify benchmark credential lane
        id: benchmark_lane
        env:
          BENCHMARK_ID: ${{ inputs.benchmark_id }}
        run: |
          set -euo pipefail
          normalized="$(
            printf '%s' "$BENCHMARK_ID" |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' |
              tr '[:upper:]' '[:lower:]'
          )"
          case "$normalized" in
            skilltrustbench | cuhk-zhuque/skilltrustbench)
              echo "lane=skilltrust" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "lane=generic" >>"$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ClawScan
        run: go build -o ./dist/clawscan ./cmd/clawscan

      - name: Pull ClawScan runtime image
        if: ${{ inputs.sandbox == 'docker' }}
        env:
          CLAWSCAN_SANDBOX_IMAGE: ${{ inputs.sandbox_image || 'ghcr.io/openclaw/clawscan-runtime@sha256:8795ee4802f8d3cb58bd724594e3794d2950b6a684df516064cf2761d9e63b09' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CLAWSCAN_SANDBOX_IMAGE" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
            echo "sandbox_image must be pinned by sha256 digest" >&2
            exit 1
          fi
          docker pull "$CLAWSCAN_SANDBOX_IMAGE"

      - name: Run SkillTrustBench benchmark
        if: ${{ steps.benchmark_lane.outputs.lane == 'skilltrust' }}
        env:
          BENCHMARK_ID: ${{ inputs.benchmark_id }}
          PROFILE: ${{ inputs.profile }}
          CONFIG_PATH: ${{ inputs.config_path }}
          SCANNERS: ${{ inputs.scanners }}
          SPLIT: ${{ inputs.split }}
          IDS: ${{ env.BENCHMARK_IDS }}
          IDS_SHA256: ${{ inputs.ids_sha256 }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          PREDICTIONS_OUTPUT: ${{ inputs.predictions_output }}
          OUTPUT_PATH: ${{ inputs.output_path || './artifacts/clawscan-benchmark.json' }}
          CLAWSCAN_SANDBOX: ${{ inputs.sandbox }}
          CLAWSCAN_SANDBOX_IMAGE: ${{ inputs.sandbox_image || 'ghcr.io/openclaw/clawscan-runtime@sha256:8795ee4802f8d3cb58bd724594e3794d2950b6a684df516064cf2761d9e63b09' }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash scripts/run-ci-benchmark.sh

      - name: Run benchmark
        if: ${{ steps.benchmark_lane.outputs.lane == 'generic' }}
        env:
          BENCHMARK_ID: ${{ inputs.benchmark_id }}
          PROFILE: ${{ inputs.profile }}
          CONFIG_PATH: ${{ inputs.config_path }}
          SCANNERS: ${{ inputs.scanners }}
          SPLIT: ${{ inputs.split }}
          IDS: ${{ env.BENCHMARK_IDS }}
          IDS_SHA256: ${{ inputs.ids_sha256 }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          PREDICTIONS_OUTPUT: ${{ inputs.predictions_output }}
          OUTPUT_PATH: ${{ inputs.output_path || './artifacts/clawscan-benchmark.json' }}
          CLAWSCAN_SANDBOX: ${{ inputs.sandbox }}
          CLAWSCAN_SANDBOX_IMAGE: ${{ inputs.sandbox_image || 'ghcr.io/openclaw/clawscan-runtime@sha256:8795ee4802f8d3cb58bd724594e3794d2950b6a684df516064cf2761d9e63b09' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
          DEFAULT_BASE_URL: ${{ secrets.DEFAULT_BASE_URL }}
          DEFAULT_MODEL_CONTEXT_WINDOW: ${{ secrets.DEFAULT_MODEL_CONTEXT_WINDOW }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash scripts/run-ci-benchmark.sh

      - name: Summarize benchmark
        if: always()
        env:
          OUTPUT_PATH: ${{ inputs.output_path || './artifacts/clawscan-benchmark.json' }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'clawscan-benchmark' }}
        run: |
          {
            echo "## ClawScan benchmark"
            echo
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo "- Output path: \`$OUTPUT_PATH\`"
            if [ -f "$OUTPUT_PATH" ]; then
              echo
              echo "### Summary"
              jq -r '
                "- benchmark: \(.benchmark.id) (\(.benchmark.split) split)",
                "- ids: \(.benchmark.idsCount // 0) from \(.benchmark.idsSource // "not set")",
                "- cases: \(.summary.caseCount // 0)",
                "- correct: \(.summary.evaluation.correct // 0)",
                "- incorrect: \(.summary.evaluation.incorrect // 0)",
                "- abstained: \(.summary.evaluation.abstained // 0)",
                "- errors: \(.summary.evaluation.errors // 0)"
              ' "$OUTPUT_PATH"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name || 'clawscan-benchmark' }}
          path: |
            ./artifacts/**
            ${{ inputs.output_path || './artifacts/clawscan-benchmark.json' }}
            ${{ inputs.predictions_output }}
          if-no-files-found: error
