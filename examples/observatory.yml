version: 1

# Keep false until the Proxmox network and guest-user controls below have an
# independent verification receipt.
live: false
# Stable public ID required when rendering version deltas for skills.
targetLineage: example/demo-skill
artifactsDir: ~/.cache/clawhub-observatory/runs

executor:
  kind: crabbox
  command: crabbox
  # If command is a credential wrapper, pin the audited Crabbox binary here.
  crabboxBinary: ""
  crabboxConfig: /path/to/isolated-observatory.crabbox.yml
  # Process-local CA bundle used to verify the Proxmox API certificate. Live
  # mode rejects missing, mutable, symlinked, non-CA, or oversized files.
  tlsCAFile: /path/to/proxmox-ca.pem
  # Observatory pins the provider, target, full-clone, teardown, and TTL flags.
  args: []

isolation:
  substrate: proxmox-vm
  networkMode: deny-except-model
  verified: false
  verification: pending
  vmTemplateId: 9400
  networkBridge: vmbr1
  freshVm: true
  dedicatedNetwork: true
  defaultDenyEgress: true
  noHostMounts: true
  noRuntimeSockets: true
  syntheticIdentityOnly: true

runtime:
  openclawCommand: openclaw
  agentUser: observatory
  timeoutSeconds: 600
  model:
    provider: observatory
    baseUrl: http://10.0.0.20:8000/v1
    id: local-tool-model
    api: openai-completions
    contextWindow: 65536
    maxTokens: 4096
  # Mandatory Observatory-owned relay. The hostile lane can reach this exact
  # loopback port, never the real model endpoint. Defaults shown explicitly.
  modelRelay:
    address: 127.0.0.8:9010
    maxRequests: 8
    maxRequestBytes: 8388608
    maxResponseBytes: 16777216
    maxTotalBytes: 33554432
    maxConcurrentRequests: 2
    # 0 uses the shorter of timeoutSeconds and 120 seconds per request.
    requestTimeoutSeconds: 0
  # Addresses as seen from the guest. Values never enter public evidence.
  # Only the separate relay control unit receives this upstream allowlist.
  controlPlaneAddresses: [10.0.0.20:8000]
  # Controlled mock egress upgrades outbound-attempt evidence to payload-aware
  # evidence without permitting real egress. Opt-in and disabled by default. The
  # sink is a guest-local IPv4 loopback endpoint (captured bytes never leave the
  # VM); its address is a distinct, auditable allowlist entry separate from the
  # exact model control plane above. Raw captured bytes stay in the private
  # bundle; only counts, a digest, encoding, and canary presence are published.
  mockEgress:
    enabled: false
    address: 127.0.0.9:9009
    maxRequests: 16
    maxBytesPerRequest: 65536
    maxTotalBytes: 262144
    # deadlineSeconds: 0 derives a lane-length backstop from timeoutSeconds.
    deadlineSeconds: 0
    # Optional deterministic canned response returned to the target, base64.
    cannedResponseBase64: ""

exercise:
  turnLimit: 1
  # Omit prompt to use the target-aware default. Plugin scans then invoke the
  # first declared tool; set an explicit prompt only for a custom scenario.

redirect:
  # Instruction-redirection probes seed synthetic injected instructions into
  # workspace content automatically; no operator scenario is required. The deep
  # repeat mode is reserved for a future release and must stay false. The default
  # path runs one Crabbox deployment and one paired baseline/exercise trial.
  deep: false

limits:
  maxFiles: 5000
  maxFileBytes: 10485760
  maxTotalBytes: 104857600
  maxBundleBytes: 67108864
  maxLaneBytes: 268435456
  maxMemoryBytes: 2147483648
  cpuQuotaPercent: 200
  maxTasks: 256
