version: 1

profiles:
  clawhub:
    scanners:
      - skillspector
      - virustotal
      - clawscan-static
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
        - VIRUSTOTAL_API_KEY
    judge:
      command: >-
        codex exec --cd {{ workspace }}
        --model gpt-5.5
        --sandbox read-only
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c service_tier=fast
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
  clawhub-oauth:
    scanners:
      - virustotal
      - skillspector
      - clawscan-static
    sandbox:
      env:
        - VIRUSTOTAL_API_KEY
    judge:
      execution: host
      waitForScanners:
        - virustotal
      waitTimeout: 10m
      waitInterval: 30s
      command: >-
        codex exec --cd {{ workspace }}
        --model gpt-5.5
        --skip-git-repo-check
        --ignore-user-config
        --ignore-rules
        -c 'approval_policy="never"'
        -c 'default_permissions="clawscan_judge"'
        -c 'permissions.clawscan_judge={description="Read-only access to the staged ClawScan judge workspace.",filesystem={":minimal"="read",":workspace_roots"={"."="read"}},network={enabled=false}}'
        -c 'features.shell_tool=true'
        -c 'features.apps=false'
        -c 'features.hooks=false'
        -c 'features.goals=false'
        -c 'features.memories=false'
        -c 'features.multi_agent=false'
        -c 'features.remote_plugin=false'
        -c 'web_search="disabled"'
        -c 'project_doc_max_bytes=0'
        -c 'project_doc_fallback_filenames=[]'
        -c 'model_reasoning_effort="high"'
        -c 'service_tier="fast"'
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
